version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    reviewers:
      - scarson
    labels:
      - dependencies
      - go

  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: weekly
    reviewers:
      - scarson
    labels:
      - dependencies
      - frontend
    groups:
      # eslint-plugin-oxlint pins its oxlint peer to the same minor, so both must move together
      oxlint:
        patterns:
          - oxlint
          - eslint-plugin-oxlint

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    reviewers:
      - scarson
    labels:
      - dependencies
      - ci
