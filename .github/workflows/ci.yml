name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          args: --timeout=10m

  test-api:
    name: "Test: API (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: A-I
            run-filter: "^Test[A-I]"
          - shard: J-Z
            run-filter: "^Test[J-Z]"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: vet
        # vet runs once per shard but is fast; avoids a separate job
        run: go vet ./internal/api/...

      - name: test
        run: go test -race -count=1 -timeout=1800s -run '${{ matrix.run-filter }}' ./internal/api/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  test-store:
    name: "Test: Store (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: A-I
            run-filter: "^Test[A-I]"
          - shard: J-Z
            run-filter: "^Test[J-Z]"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: vet
        run: go vet ./internal/store/...

      - name: test
        run: go test -race -count=1 -timeout=1800s -run '${{ matrix.run-filter }}' ./internal/store/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  test-other:
    name: "Test: Other"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: vet
        run: go vet ./...

      - name: test
        # Exclude api and store (tested in dedicated jobs) to avoid
        # contending for CPU with those heavy packages.
        # Ryuk disabled in CI — runners are ephemeral, no orphan risk.
        run: |
          packages=$(go list ./... | grep -v '/internal/api$\|/internal/store$')
          go test -race -count=1 -timeout=900s $packages
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  test-web:
    name: "Test: Web"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: type-check
        run: npx vue-tsc --build

      - name: lint
        run: npm run lint

      - name: test
        run: npx vitest run

      - name: generated API types match openapi.json
        run: |
          npm run generate-api
          git diff --exit-code src/lib/api/schema.d.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: build
        run: go build ./cmd/cvert-ops

  stack-smoke:
    name: "Stack: Production Compose"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: start the production stack and check it serves requests
        run: bash docker/smoke-test.sh

  build-web:
    name: "Build: Web"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: build
        run: npm run build
