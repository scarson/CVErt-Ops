name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.10.1
          args: --timeout=10m

  test-api:
    name: "Test: API (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: A-I
            run-filter: "^Test[A-I]"
          - shard: J-Z
            run-filter: "^Test[J-Z]"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: vet
        # vet runs once per shard but is fast; avoids a separate job
        run: go vet ./internal/api/...

      - name: test
        run: go test -race -count=1 -timeout=1800s -run '${{ matrix.run-filter }}' ./internal/api/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  test-store:
    name: "Test: Store (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: A-I
            run-filter: "^Test[A-I]"
          - shard: J-Z
            run-filter: "^Test[J-Z]"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - name: vet
        run: go vet ./internal/store/...

      - name: test
        run: go test -race -count=1 -timeout=1800s -run '${{ matrix.run-filter }}' ./internal/store/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  test-other:
    name: "Test: Other"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: vet
        run: go vet ./...

      - name: test
        # Exclude api and store (tested in dedicated jobs) to avoid
        # contending for CPU with those heavy packages.
        # Ryuk disabled in CI — runners are ephemeral, no orphan risk.
        run: |
          packages=$(go list ./... | grep -v '/internal/api$\|/internal/store$')
          go test -race -count=1 -timeout=900s $packages
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: |
          # Temporary exceptions for unpatched docker/docker vulns (test-only dependency).
          # GO-2026-4887: AuthZ plugin bypass (daemon-side, not client SDK)
          # GO-2026-4883: Plugin privilege validation off-by-one (daemon-side)
          # These affect testcontainers-go's transitive dep, not production code.
          # Expiry: 2026-07-05 — after this date CI fails to force re-evaluation.
          EXPIRY="2026-07-05"
          if [[ "$(date +%Y-%m-%d)" > "$EXPIRY" ]]; then
            echo "::error::govulncheck exception expired on $EXPIRY — re-evaluate docker/docker vuln status"
            govulncheck ./...
            exit 1
          fi
          govulncheck ./... 2>&1 | tee /tmp/vulncheck.out || true
          if grep -q 'Vulnerability #' /tmp/vulncheck.out; then
            filtered=$(grep 'Vulnerability #' /tmp/vulncheck.out | grep -v 'GO-2026-4887\|GO-2026-4883' || true)
            if [[ -n "$filtered" ]]; then
              echo "::error::New vulnerabilities found beyond known exceptions:"
              echo "$filtered"
              exit 1
            fi
            echo "::warning::Known docker/docker vulns still present — no fix available. Exception expires $EXPIRY."
          fi

  test-web:
    name: "Test: Web"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: type-check
        run: npx vue-tsc --build

      - name: lint
        run: npm run lint

      - name: test
        run: npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed.go)
        run: cd web && npm ci && npm run build-only

      - name: build
        run: go build ./cmd/cvert-ops

  build-web:
    name: "Build: Web"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: build
        run: npm run build
