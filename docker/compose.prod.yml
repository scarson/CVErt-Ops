# CVErt Ops — production overlay
#
# Usage: docker compose -f docker/compose.yml -f docker/compose.prod.yml --profile app up -d
#
# This file overrides dev settings for production use. It does NOT modify
# docker/compose.yml — it is applied as a Docker Compose merge overlay.
#
# Required env vars (in .env or exported):
#   POSTGRES_PASSWORD    — strong random password
#   JWT_SECRET           — ≥32 random bytes
#   CADDY_HOST           — your public domain (e.g., cvert.example.com)
#   EXTERNAL_URL         — https://<CADDY_HOST>
#
# Changes from dev:
#   - Production env defaults (APP_ENV, LOG_LEVEL, LOG_FORMAT, REGISTRATION_MODE)
#   - Resource limits on all containers
#   - Log rotation (json-file driver, 10 MB per file, 5 files)
#   - App metrics port (9090) on internal network only (not exposed to host)
#   - Tighter health check intervals

services:

  postgres:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mailpit:
    # Mailpit is typically not used in production. Override with a real SMTP
    # relay by setting SMTP_HOST/SMTP_PORT/SMTP_PASSWORD in .env. If you still
    # want mailpit running (e.g., staging), this block keeps it resource-bounded.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  migrate:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  app:
    environment:
      APP_ENV:            production
      LOG_LEVEL:          ${LOG_LEVEL:-info}
      LOG_FORMAT:         ${LOG_FORMAT:-json}
      REGISTRATION_MODE:  ${REGISTRATION_MODE:-invite-only}
      COOKIE_SECURE:      "true"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Metrics port on internal network only — reachable by Prometheus on cvert-data-net
    # but not exposed to the public internet.
    ports:
      - target: 9090
        published: 9090
        protocol: tcp

  caddy:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
